# Tempora: the whole stack on one machine.
#   docker compose up --build
# Portal http://localhost:3000 · Console http://localhost:3001 · Platform Admin http://localhost:3002
# API http://localhost:4000 (docs: /v1/docs) · Mailpit http://localhost:8025
# Object storage (S3 API, images) http://localhost:8333
#
# Database passwords come from a local, git-ignored .env file next to this one:
#   cp .env.example .env   (then choose your own passwords)
# Production secrets live only in the hosting platforms.

name: tempora

# Every image comes from the root Dockerfile with the same build arguments, so the images share
# one install and one build; each service only picks its target.
x-build: &build
  context: .
  dockerfile: Dockerfile
  args:
    # The browser calls the API directly, so these are host-facing URLs.
    NEXT_PUBLIC_API_URL: http://localhost:4000
    NEXT_PUBLIC_CONSOLE_URL: http://localhost:3001
    NEXT_PUBLIC_APP_TIME_ZONE: America/New_York
    NEXT_PUBLIC_PORTAL_URL: http://localhost:3000

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tempora
      POSTGRES_DB: tempora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      # Used by docker/postgres/init/01-roles.sh on the first start.
      TEMPORA_APP_PASSWORD: ${TEMPORA_APP_PASSWORD:?Set TEMPORA_APP_PASSWORD in .env}
      TEMPORA_JOBS_PASSWORD: ${TEMPORA_JOBS_PASSWORD:?Set TEMPORA_JOBS_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./Backend/booking-api/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tempora -d tempora']
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.33
    ports:
      - '8025:8025' # web inbox
      - '1025:1025' # SMTP

  # S3-compatible storage for logos and cover photos (FSD 6.15), like Cloudflare R2 in
  # production. Browsers upload to it and load images from it, so its port is published.
  storage:
    image: chrislusf/seaweedfs:4.50
    entrypoint: ['/bin/sh', '/docker/start.sh']
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env (see .env.example)}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
      S3_BUCKET: tempora-files
    volumes:
      - storage-data:/data
      - ./Backend/booking-api/docker/storage/start.sh:/docker/start.sh:ro
    ports:
      - '8333:8333'

  migrate:
    build:
      <<: *build
      target: migrate
    environment:
      DATABASE_MIGRATION_URL: postgresql://tempora:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}@postgres:5432/tempora
    depends_on:
      postgres:
        condition: service_healthy

  # Demo businesses and accounts (FSD 10.3), once: an existing demo is kept. Start again with
  #   docker compose run --rm seed node dist/scripts/seed-demo.js --reset
  seed:
    build:
      <<: *build
      target: api
    command: ['node', 'dist/scripts/seed-demo.js']
    environment:
      DATABASE_MIGRATION_URL: postgresql://tempora:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}@postgres:5432/tempora
      APP_TIME_ZONE: America/New_York
      PORTAL_URL: http://localhost:3000
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build:
      <<: *build
      target: api
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      PORT: 4000
      APP_VERSION: local
      DATABASE_URL: postgresql://tempora_app:${TEMPORA_APP_PASSWORD:?Set TEMPORA_APP_PASSWORD in .env}@postgres:5432/tempora
      PORTAL_URL: http://localhost:3000
      CONSOLE_URL: http://localhost:3001
      ADMIN_URL: http://localhost:3002
      TOKEN_HASH_SECRET: ${TOKEN_HASH_SECRET:?Set TOKEN_HASH_SECRET in .env (see .env.example)}
      APP_TIME_ZONE: America/New_York
      # The API reaches storage inside Docker; browsers reach it on localhost.
      S3_ENDPOINT: http://storage:8333
      S3_UPLOAD_ENDPOINT: http://localhost:8333
      S3_REGION: us-east-1
      S3_BUCKET: tempora-files
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env (see .env.example)}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
      S3_PUBLIC_BASE_URL: http://localhost:8333/tempora-files
    ports:
      - '4000:4000'
    # Not waiting for the seed: if it cannot run (see its log), the stack still starts.
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage:
        condition: service_started

  worker:
    build:
      <<: *build
      target: worker
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      JOBS_DATABASE_URL: postgresql://tempora_jobs:${TEMPORA_JOBS_PASSWORD:?Set TEMPORA_JOBS_PASSWORD in .env}@postgres:5432/tempora
      SMTP_URL: smtp://mailpit:1025
      EMAIL_FROM: Tempora <no-reply@tempora.local>
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  portal:
    build:
      <<: *build
      target: portal
    ports:
      - '3000:3000'
    depends_on: [api]

  console:
    build:
      <<: *build
      target: console
    ports:
      - '3001:3000'
    depends_on: [api]

  platform-admin:
    build:
      <<: *build
      target: platform-admin
    ports:
      - '3002:3000'
    depends_on: [api]

volumes:
  postgres-data:
  storage-data:
