name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push cancels a pull request's run; on main it waits, so a deploy never stops halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Lint, type check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm headers:check
      - run: pnpm lint
      - run: pnpm turbo run build typecheck test

  database:
    name: Migrations, integration tests, API and worker against PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tempora
          POSTGRES_PASSWORD: ci_owner
          POSTGRES_DB: tempora
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tempora -d tempora"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PGHOST: localhost
      PGPASSWORD: ci_owner
      POSTGRES_USER: tempora
      POSTGRES_DB: tempora
      TEMPORA_APP_PASSWORD: ci_app
      TEMPORA_JOBS_PASSWORD: ci_jobs
      DATABASE_MIGRATION_URL: postgresql://tempora:ci_owner@localhost:5432/tempora
      DATABASE_URL: postgresql://tempora_app:ci_app@localhost:5432/tempora
      JOBS_DATABASE_URL: postgresql://tempora_jobs:ci_jobs@localhost:5432/tempora
      PORTAL_URL: http://localhost:3000
      CONSOLE_URL: http://localhost:3001
      ADMIN_URL: http://localhost:3002
      LOG_LEVEL: warn
      # CI-only values; real secrets live in the hosting platforms.
      TOKEN_HASH_SECRET: ci-only-token-hash-secret-0123456789abcdef
      APP_TIME_ZONE: America/New_York
      SMTP_URL: smtp://localhost:1025
      EMAIL_FROM: Tempora CI <ci@tempora.local>
      TEST_DATABASE_URL: postgresql://tempora_app:ci_app@localhost:5432/tempora
      TEST_JOBS_DATABASE_URL: postgresql://tempora_jobs:ci_jobs@localhost:5432/tempora
      TEST_DATABASE_OWNER_URL: postgresql://tempora:ci_owner@localhost:5432/tempora
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@tempora/api... --filter=@tempora/worker...

      - name: Create database roles
        run: sh Backend/booking-api/docker/postgres/init/01-roles.sh

      - name: Apply migrations (owner role)
        run: pnpm --filter=@tempora/db migrate:deploy

      - name: Migrations match the Prisma schema (no drift)
        run: pnpm --filter=@tempora/db exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Integration tests (API as tempora_app, worker as tempora_jobs)
        run: |
          pnpm --filter=@tempora/api test:integration
          pnpm --filter=@tempora/worker test:integration

      - name: API is ready with the application role
        run: |
          node Backend/booking-api/apps/api/dist/server.js &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4000/health/ready; then exit 0; fi
            sleep 1
          done
          echo "API never became ready" && exit 1

      - name: Application role cannot change the schema or the migration history
        run: |
          export PGUSER=tempora_app PGPASSWORD=ci_app
          ! psql -v ON_ERROR_STOP=1 -c "CREATE TABLE should_fail (id int)"
          ! psql -v ON_ERROR_STOP=1 -c "DELETE FROM _prisma_migrations"

      - name: Worker starts and installs the job queue
        run: |
          # "Worker started" is an info-level line; the job-wide LOG_LEVEL=warn would hide it.
          LOG_LEVEL=info node Backend/booking-api/apps/worker/dist/main.js > worker.log 2>&1 &
          for i in $(seq 1 30); do
            if grep -q "Worker started" worker.log; then cat worker.log; exit 0; fi
            sleep 1
          done
          cat worker.log && echo "Worker never started" && exit 1

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      packages: write
    env:
      # On main, once a production domain is set, the images are built with the production URLs
      # and pushed (FSD 10.2); otherwise they are only built, to prove they still build.
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.TEMPORA_DOMAIN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # docker-bake.hcl reads these variables from the environment.
      - name: Production build settings
        if: env.PUBLISH == 'true'
        env:
          DOMAIN: ${{ vars.TEMPORA_DOMAIN }}
          TIME_ZONE: ${{ vars.TEMPORA_APP_TIME_ZONE }}
        run: |
          {
            echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/"
            echo "TAGS=${GITHUB_SHA},latest"
            echo "API_URL=https://api.${DOMAIN}"
            echo "CONSOLE_URL=https://console.${DOMAIN}"
            echo "APP_TIME_ZONE=${TIME_ZONE:-America/New_York}"
            echo "PORTAL_URL=https://${DOMAIN}"
            # The live site is the public demo (FSD 10.3), as in deploy/compose.yml.
            echo "DEMO_MODE=true"
            echo "DEMO_EMAIL_DOMAIN=demo.${DOMAIN}"
          } >> "$GITHUB_ENV"
      # All six images in one bake, sharing the install and the builds (docker-bake.hcl).
      - uses: docker/bake-action@v6
        with:
          source: .
          files: docker-bake.hcl
          push: ${{ env.PUBLISH == 'true' }}
          set: |
            *.cache-from=type=gha,scope=tempora
            *.cache-to=type=gha,mode=max,scope=tempora

  deploy:
    name: Deploy to the VPS
    needs: [verify, database, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.TEMPORA_DOMAIN != ''
    runs-on: ubuntu-latest
    # One deploy at a time; a newer one waits instead of cancelling a deploy halfway.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://${{ vars.TEMPORA_DOMAIN }}
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
    steps:
      # Only the server configuration, never the source: the code reaches the server as images.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Backend/booking-api/deploy
            Backend/booking-api/docker

      # The server's host key comes from a secret, so CI never trusts an unknown server.
      - name: SSH key and known host
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host vps\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/deploy_key\n  BatchMode yes\n' \
            "$VPS_HOST" "$VPS_USER" "$VPS_PORT" > ~/.ssh/config

      # deploy/ and docker/ land in /opt/tempora; the server's own deploy/.env is left alone.
      - name: Copy the Compose file, Caddyfile and scripts
        run: tar -C Backend/booking-api -czf - deploy docker | ssh vps 'tar -xzf - -C /opt/tempora'

      # deploy/deploy.sh: pull this commit's images, migrate, start.
      - name: Start this commit's images on the server
        run: ssh vps "sh /opt/tempora/deploy/deploy.sh $GITHUB_SHA"

      - name: The new version is live
        env:
          DOMAIN: ${{ vars.TEMPORA_DOMAIN }}
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS "https://api.$DOMAIN/health/ready" > /dev/null \
              && curl -fsS "https://api.$DOMAIN/health" | grep -q "$GITHUB_SHA"; then
              echo "Live: $GITHUB_SHA"
              exit 0
            fi
            sleep 5
          done
          echo "The API never reported $GITHUB_SHA as ready" && exit 1
